- hosts: all
  gather_facts: true
  tasks:
    - name: Show system info
      debug:
        msg: "{{ ansible_distribution }} {{ ansible_distribution_version }} on {{ ansible_architecture }}"
      tags: [info]

    - name: Ensure common packages
      package:
        name: "{{ item }}"
        state: present
      loop: [tree, curl, git]
      become: true
      tags: [packages]

    - name: Show managed users
      debug:
        msg: "Current user: {{ ansible_user_id }}"
      tags: [users]
